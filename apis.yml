aid: zhangmen
name: Zhangmen
description: 'Zhangmen (掌门1对1 / 掌门教育) is a Shanghai-based online education company
  offering premium one-on-one and small-group tutoring to K-12 students across China.
  Its platform pairs students with elite instructors and layers on data-driven,
  intelligent learning analysis: diagnostic assessment, personalized study plans,
  real-time classroom monitoring, automated learning reports, and parent progress
  tracking. Beyond core academic tutoring the company runs quality-education modules
  spanning public speaking, creative art, programming, and comprehensive/mathematical
  thinking, along with a piano accompaniment-practice product (zmpeilian.com). The
  business is a direct-to-consumer web and mobile app play delivered in Simplified
  Chinese; it exposes no public developer API, SDK, or documentation surface. This
  profile was surfaced as a portfolio company of SoftBank Vision Fund and added to
  the API Evangelist network for enrichment.'
